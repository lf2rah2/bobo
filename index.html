<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8ECBE6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 72'%3E%3Cellipse cx='20' cy='18' rx='7' ry='17' fill='%23F0E2D2'/%3E%3Cellipse cx='40' cy='18' rx='7' ry='17' fill='%23F0E2D2'/%3E%3Cellipse cx='30' cy='44' rx='21' ry='19' fill='%23FBF1E4'/%3E%3Ccircle cx='23' cy='41' r='3.4' fill='%232E241C'/%3E%3Ccircle cx='37' cy='41' r='3.4' fill='%232E241C'/%3E%3C/svg%3E">
<title>Help Bobo Learn — The Three Little Pigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Fredoka',-apple-system,system-ui,sans-serif;
  background:#0E1518;color:#22303A;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
#root{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:#BFE3F5;overflow:hidden}

.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ============ TITLE ============ */
#sTitle{background:linear-gradient(#8ECBE6 0%,#BFE3F5 45%,#A8D98E 45%,#8FC978 100%);align-items:center;justify-content:center;text-align:center;padding:28px}
#sTitle h1{font-size:clamp(30px,8.4vw,44px);font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.13);line-height:1.12;margin-bottom:6px}
#sTitle .sub{font-size:16px;color:#3B5A47;font-weight:500;margin-bottom:26px}
.bigBtn{
  background:#E2694C;color:#fff;border:none;border-radius:999px;
  font-family:inherit;font-size:23px;font-weight:600;padding:20px 46px;
  box-shadow:0 7px 0 #B94F36;transition:transform .1s,box-shadow .1s;
}
.bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #B94F36}
.tiny{margin-top:22px;font-size:12.5px;color:#4B6B57;font-weight:400;max-width:270px;line-height:1.45}
.linkish{margin-top:16px;font-size:13px;color:#4B6B57;text-decoration:underline;background:none;border:none;font-family:inherit}

/* ============ PICKERS ============ */
.pickWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(#8ECBE6 0%,#C6E7F6 46%,#A8D98E 46%,#8FC978 100%)}
.pickTitle{font-size:25px;font-weight:600;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.13);margin-bottom:24px;text-align:center;line-height:1.2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:340px}
.animBtn{
  background:rgba(255,255,255,.92);border:4px solid transparent;border-radius:24px;
  padding:14px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:inherit;font-size:16px;font-weight:600;color:#3B4A55;
  box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .12s;
}
.animBtn:active{transform:scale(.94)}
.animBtn.sel{border-color:#E2694C}
.animBtn svg{width:74px;height:80px}
.nameBtn{
  background:rgba(255,255,255,.94);border:none;border-radius:20px;padding:19px 10px;
  font-family:inherit;font-size:22px;font-weight:600;color:#3B4A55;
  box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .12s;width:100%;
}
.nameBtn:active{transform:scale(.95)}
.nameCol{display:grid;gap:13px;width:100%;max-width:280px}
.palPreview{width:120px;height:132px;margin-bottom:14px}

/* ============ STORY ============ */
#stage{flex:1;position:relative;overflow:hidden;background:#BFE3F5;transition:background .9s}
#bgArt{position:absolute;inset:0}
.deco{position:absolute;pointer-events:none}
/* #sky is now a dusk veil ABOVE the cast — keeps the existing .night toggle working */
.sky{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:1.2s;
  background:linear-gradient(rgba(38,48,92,.52),rgba(96,74,116,.34))}
.sky.night{opacity:1}
.brz{animation:brz 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes brz{0%,100%{transform:scale(1,1)}50%{transform:scale(1.022,.986)}}

#bgRoom{position:absolute;inset:0;opacity:0;transition:opacity .45s}
#layer{position:absolute;inset:0;transition:opacity .34s}
.it{position:absolute;pointer-events:none}
.it.fade{animation:itFade .55s ease both}
.it.pop{animation:itPop .6s cubic-bezier(.34,1.56,.64,1) both}
.it.rise{animation:itRise .6s cubic-bezier(.22,1,.36,1) both}
.it.slideL{animation:itSlideL .75s cubic-bezier(.22,1,.36,1) both}
.it.slideR{animation:itSlideR .75s cubic-bezier(.22,1,.36,1) both}
@keyframes itFade{from{opacity:0}to{opacity:1}}
@keyframes itPop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes itRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes itSlideL{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:none}}
@keyframes itSlideR{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
.blown{animation:blowAway .9s cubic-bezier(.4,0,.7,1) forwards}
@keyframes blowAway{to{opacity:0;transform:translateX(150px) translateY(-40px) rotate(58deg) scale(.4)}}
.shake{animation:shk .28s ease-in-out 7}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dropIn{animation:dropIn 1s cubic-bezier(.55,0,.85,.6) forwards}
@keyframes dropIn{from{transform:translateY(-230px) rotate(-14deg)}to{transform:translateY(0) rotate(0)}}
.shootOut{animation:shootOut .85s cubic-bezier(.4,0,.7,1) forwards}
@keyframes shootOut{to{transform:translate(230px,-120px) rotate(46deg) scale(.55);opacity:0}}
.climb{animation:climb 2s ease-in-out forwards}
@keyframes climb{from{transform:translate(-70px,58px) scale(.85)}to{transform:translate(0,0) scale(1)}}
.cheer{animation:cheer .7s ease-in-out infinite;transform-origin:50% 100%}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-13px) rotate(4deg)}}
.spin{animation:spin 9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:floatUp 3.4s ease-in-out infinite}
@keyframes floatUp{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(8deg)}}

.pal{filter:drop-shadow(0 3px 3px rgba(60,45,30,.28));
  animation:brz 3.4s ease-in-out infinite;transform-origin:50% 100%}
.pal.excited{animation:palHop .62s cubic-bezier(.4,0,.5,1) infinite}
.pal.excited .ear{animation:earLag .62s cubic-bezier(.4,0,.5,1) infinite}
#pal.hide{opacity:0;transform:translateY(20px)}

#bookBtn{
  position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:12;
  background:rgba(255,255,255,.95);border:none;border-radius:16px;padding:8px 12px;
  display:flex;align-items:center;gap:6px;font-family:inherit;font-size:15px;font-weight:600;color:#3B4A55;
  box-shadow:0 3px 8px rgba(0,0,0,.18);
}
#bookBtn.bump{animation:bump .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes bump{0%,100%{transform:scale(1)}45%{transform:scale(1.3)}}

#bar{
  flex-shrink:0;background:#fff;border-radius:26px 26px 0 0;padding:16px 20px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(0,0,0,.13);min-height:118px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:8;
}
#narr{font-size:19px;line-height:1.36;font-weight:500;color:#28353E;text-align:center}
#skip{position:absolute;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));background:none;border:none;font-family:inherit;font-size:12px;color:#B9C4CC;padding:8px 10px}

/* ============ WORD MOMENT ============ */
#word{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:22px;background:rgba(18,30,38,.72);backdrop-filter:blur(4px)}
#word.on{display:flex;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#wordCard{
  background:#fff;border-radius:34px;padding:22px 26px 26px;text-align:center;width:100%;max-width:330px;
  box-shadow:0 22px 50px rgba(0,0,0,.45);transform:scale(.7);opacity:0;transition:.5s cubic-bezier(.34,1.6,.64,1);
}
#wordCard.in{transform:none;opacity:1}
#wordPic{width:150px;height:150px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#F4EFE3;transition:.3s}
#wordPic:active{transform:scale(.93)}
#wordPic svg{width:112px;height:112px}
#wordText{font-size:44px;font-weight:700;color:#28353E;letter-spacing:-.5px;line-height:1}
#wordEs{font-size:16px;font-weight:500;color:#2F7D6E;margin-top:3px;height:20px}
#wordAsk{font-size:17px;font-weight:500;color:#6B7B87;margin-top:12px;min-height:24px}
#micRing{width:96px;height:96px;margin:14px auto 0;position:relative;display:flex;align-items:center;justify-content:center}
#micDot{width:74px;height:74px;border-radius:50%;background:#E2694C;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #B94F36;transition:transform .1s}
#micDot svg{width:32px;height:32px;fill:#fff}
#micRing.live::before,#micRing.live::after{content:"";position:absolute;inset:4px;border-radius:50%;border:3px solid #E2694C;animation:mring 1.6s ease-out infinite}
#micRing.live::after{animation-delay:.8s}
@keyframes mring{0%{transform:scale(.85);opacity:.85}100%{transform:scale(1.5);opacity:0}}
#lvl{position:absolute;inset:0;border-radius:50%;border:5px solid #F2C14E;transform:scale(.5);opacity:0;transition:.12s}
#wordYay{font-size:26px;font-weight:700;color:#2F7D6E;margin-top:10px;min-height:34px;opacity:0;transition:.4s}
#wordYay.in{opacity:1}
.flyCard{position:fixed;z-index:40;width:82px;height:82px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.35);pointer-events:none}
.flyCard svg{width:56px;height:56px}

/* ============ BOOK ============ */
#sBook{background:linear-gradient(#F7EFDF,#EADCC2);overflow-y:auto}
.bookIn{padding:calc(26px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
.bookIn h2{font-size:27px;font-weight:700;color:#3B4A55;margin-bottom:4px}
.bookIn .s{font-size:15px;color:#7C8A93;margin-bottom:20px;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:24px}
.kc{background:#fff;border-radius:18px;padding:11px 5px 9px;box-shadow:0 4px 0 rgba(0,0,0,.09);transition:transform .12s;border:none;font-family:inherit}
.kc:active{transform:scale(.93)}
.kc svg{width:50px;height:50px}
.kc .w{font-size:14px;font-weight:600;color:#3B4A55;margin-top:3px}
.kc .e{font-size:10.5px;font-weight:500;color:#2F7D6E}
.kc.locked{background:rgba(255,255,255,.45);box-shadow:none}
.kc.locked .w,.kc.locked .e{color:#BCAF98}
</style>
</head>
<body>
<div id="root">

  <!-- ================= TITLE ================= -->
  <section class="screen on" id="sTitle">
    <div style="width:132px;height:146px;margin-bottom:14px" id="titlePal"></div>
    <h1>Help Bobo Learn</h1>
    <div class="sub">The Three Little Pigs</div>
    <button class="bigBtn" id="startBtn">Start</button>
    <p class="tiny">Best with sound on. We’ll ask for the microphone so Bobo can hear your little one — tapping the picture always works too.</p>
    <button class="linkish" id="resetBtn" style="display:none">Start over (clear Bobo’s words)</button>
  </section>

  <!-- ================= PICK ANIMAL ================= -->
  <section class="screen" id="sPick">
    <div class="pickWrap">
      <div class="pickTitle">Who wants to<br>come with you?</div>
      <div class="grid2" id="animalGrid"></div>
    </div>
  </section>

  <!-- ================= PICK NAME ================= -->
  <section class="screen" id="sName">
    <div class="pickWrap">
      <div class="palPreview" id="namePal"></div>
      <div class="pickTitle" style="margin-bottom:18px">What shall we<br>call them?</div>
      <div class="nameCol" id="nameCol"></div>
    </div>
  </section>

  <!-- ================= STORY ================= -->
  <section class="screen" id="sStory">
    <div id="stage">
      <div id="bgArt"></div>
      <div id="bgRoom"></div>
      <div id="layer"></div>
      <button id="bookBtn"><span>📖</span><span id="bookCount">0</span></button>
      <div class="sky" id="sky"></div>
    </div>
    <div id="bar">
      <div id="narr">…</div>
      <button id="skip">skip ›</button>
    </div>

    <div id="word">
      <div id="wordCard">
        <div id="wordPic"></div>
        <div id="wordText">wolf</div>
        <div id="wordEs"></div>
        <div id="wordAsk">Can you say it?</div>
        <div id="micRing"><div id="lvl"></div><div id="micDot"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15z"/><path d="M18.5 11.5a.9.9 0 0 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 0 0-1.8 0 6.5 6.5 0 0 0 5.6 6.4V21h-2a.9.9 0 0 0 0 1.8h5.8a.9.9 0 0 0 0-1.8h-2v-3.1a6.5 6.5 0 0 0 5.6-6.4z"/></svg></div></div>
        <div id="wordYay">Yay!</div>
      </div>
    </div>
  </section>

  <!-- ================= BOOK ================= -->
  <section class="screen" id="sBook">
    <div class="bookIn">
      <div style="width:104px;height:114px;margin:0 auto 10px" id="bookPal"></div>
      <h2 id="bookTitle">Bobo’s Word Book</h2>
      <div class="s" id="bookSub">Tap a card to hear it again</div>
      <div class="cards" id="cardGrid"></div>
      <button class="bigBtn" id="againBtn" style="font-size:19px;padding:16px 34px">Read it again</button>
      <button class="linkish" id="homeBtn">Back to start</button>
    </div>
  </section>

</div>

<script>
/* ============================================================
   ART
   ============================================================ */
/* =========================================================
   ART — full-body vector cast (Soft Storybook)
   Set STYLE to 'inked' or 'paper' to reskin the whole app.
   ========================================================= */
const STYLE = 'soft';

const PAL = {
  bunny:{a:'#FFFDF9',b:'#F6E9D9',c:'#E2CDB2',ln:'#C6AE92',i1:'#F4C9D2',i2:'#E9A9B8',nose:'#E2836F',eye:'#2E241C',belly:'#FFFDF6'},
  bear :{a:'#E3BE93',b:'#C79A6B',c:'#A87A52',ln:'#8A6242',i1:'#EACDA8',i2:'#D9B58E',nose:'#4A3222',eye:'#33261A',belly:'#F0DBBE'},
  duck :{a:'#FFF0B4',b:'#F7DC6B',c:'#E6C64A',ln:'#CBA733',i1:'#FFF6D2',i2:'#F3D98C',nose:'#E2894C',eye:'#33301A',belly:'#FFF8DC'},
  cat  :{a:'#DCE4EC',b:'#B8C5D1',c:'#97A7B6',ln:'#7E8E9D',i1:'#F2B7C0',i2:'#E39AA6',nose:'#E2836F',eye:'#2E3138',belly:'#EDF2F6'}
};
function ln(p){
  return STYLE==='inked' ? 'stroke="#2A2118" stroke-width="4" stroke-linejoin="round"'
       : STYLE==='paper' ? ''
       : 'stroke="'+p.ln+'" stroke-width="1.7" stroke-linejoin="round"';
}

/* one body, four heads — the "one rig, four skins" rule */
function critter(kind){
  const p = PAL[kind], id = kind, st = ln(p);
  const EARS = {
    bunny:'<g class="ear" style="transform-origin:60px 92px">'+
      '<path d="M44 40 C35 24 32 9 39 6 C46 3 53 20 55 38 C52 42 47 43 44 40 Z" fill="url(#f'+id+')" '+st+'/>'+
      '<path d="M45.5 35 C40 22 39 12 42 11 C45 10 48.5 22 50.5 34 C49 36 47 36 45.5 35 Z" fill="url(#e'+id+')"/>'+
      '<path d="M70 38 C73 21 78 7 85 9 C92 12 88 27 80 40 C76 43 72 42 70 38 Z" fill="url(#f'+id+')" '+st+'/>'+
      '<path d="M72 34 C74.5 21 78 12 81 13 C84 14 81.5 24 77 34 C75 36 73 36 72 34 Z" fill="url(#e'+id+')"/></g>',
    bear:'<g class="ear" style="transform-origin:60px 92px">'+
      '<circle cx="30" cy="35" r="15" fill="url(#f'+id+')" '+st+'/>'+
      '<circle cx="90" cy="35" r="15" fill="url(#f'+id+')" '+st+'/>'+
      '<circle cx="30" cy="35" r="7.5" fill="url(#e'+id+')"/>'+
      '<circle cx="90" cy="35" r="7.5" fill="url(#e'+id+')"/></g>',
    duck:'<g class="ear" style="transform-origin:60px 92px">'+
      '<path d="M57 28 C50 14 57 2 66 5 C74 8 70 20 64 29 Z" fill="url(#f'+id+')" '+st+'/></g>',
    cat:'<g class="ear" style="transform-origin:60px 92px">'+
      '<path d="M26 48 L19 11 L53 31 Z" fill="url(#f'+id+')" '+st+'/>'+
      '<path d="M94 48 L101 11 L67 31 Z" fill="url(#f'+id+')" '+st+'/>'+
      '<path d="M30 43 L26 20 L46 32 Z" fill="url(#e'+id+')"/>'+
      '<path d="M90 43 L94 20 L74 32 Z" fill="url(#e'+id+')"/></g>'
  }[kind];
  const TAIL = {
    bunny:'<circle cx="93" cy="120" r="10" fill="url(#f'+id+')" '+st+'/>',
    bear :'<circle cx="92" cy="124" r="7" fill="url(#f'+id+')" '+st+'/>',
    duck :'<path d="M88 108 q16 -4 20 8 q-12 6 -20 2 Z" fill="url(#f'+id+')" '+st+'/>',
    cat  :'<path d="M90 116 c16 -4 20 10 10 18 c-6 5 -12 -1 -8 -6" stroke="'+(STYLE==='inked'?'#2A2118':p.c)+'" stroke-width="6" fill="none" stroke-linecap="round"/>'
  }[kind];
  const FACE = {
    bunny:'<path d="M60 68 L64.6 72.4 Q60 76 55.4 72.4 Z" fill="'+p.nose+'"/>'+
      '<path d="M60 76 v4 M60 80 q-5.4 4.6 -9.4 .6 M60 80 q5.4 4.6 9.4 .6" stroke="'+p.eye+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+
      '<path d="M26 66 h11 M27 73 h10 M94 66 h-11 M93 73 h-10" stroke="'+p.ln+'" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>',
    bear:'<ellipse cx="60" cy="75" rx="17" ry="12.5" fill="url(#e'+id+')"/>'+
      '<ellipse cx="60" cy="69" rx="6" ry="4.4" fill="'+p.nose+'"/>'+
      '<path d="M60 73 v3.6 M60 76.6 q-5 4 -8 .6 M60 76.6 q5 4 8 .6" stroke="'+p.nose+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>',
    duck:'<path d="M41 73 q19 -7 38 0 q-4 13 -19 13 q-15 0 -19 -13 Z" fill="'+p.nose+'"/>'+
      '<path d="M41 73 q19 -7 38 0 q-2 4.5 -19 4.5 q-17 0 -19 -4.5 Z" fill="#F0A464"/>',
    cat:'<path d="M60 68 L65 72 Q60 76.5 55 72 Z" fill="'+p.nose+'"/>'+
      '<path d="M60 76 v3.4 M60 79.4 q-5.4 4.6 -9.4 .6 M60 79.4 q5.4 4.6 9.4 .6" stroke="'+p.eye+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+
      '<path d="M24 64 h13 M25 72 h12 M96 64 h-13 M95 72 h-12" stroke="'+p.ln+'" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>'
  }[kind];
  return '<svg viewBox="0 0 120 162">'+
   '<defs><radialGradient id="f'+id+'" cx="34%" cy="26%" r="82%">'+
     '<stop offset="0%" stop-color="'+p.a+'"/><stop offset="58%" stop-color="'+p.b+'"/><stop offset="100%" stop-color="'+p.c+'"/></radialGradient>'+
   '<linearGradient id="e'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0%" stop-color="'+p.i1+'"/><stop offset="100%" stop-color="'+p.i2+'"/></linearGradient></defs>'+
   '<ellipse cx="60" cy="153" rx="34" ry="6.5" fill="#2E241C" opacity=".15"/>'+
   '<ellipse cx="43" cy="146" rx="15" ry="9.5" fill="url(#f'+id+')" '+st+'/>'+
   '<ellipse cx="77" cy="146" rx="15" ry="9.5" fill="url(#f'+id+')" '+st+'/>'+
   TAIL+
   '<path d="M60 84 C79 84 91 99 91 118 C91 137 78 147 60 147 C42 147 29 137 29 118 C29 99 41 84 60 84 Z" fill="url(#f'+id+')" '+st+'/>'+
   '<ellipse cx="60" cy="122" rx="17" ry="19" fill="'+p.belly+'" opacity=".7"/>'+
   '<ellipse cx="30" cy="112" rx="8.5" ry="14" transform="rotate(16 30 112)" fill="url(#f'+id+')" '+st+'/>'+
   '<ellipse cx="90" cy="112" rx="8.5" ry="14" transform="rotate(-16 90 112)" fill="url(#f'+id+')" '+st+'/>'+

   Duplicate gradient ids make later copies render unfilled, so hand out a fresh
   set of ids on every read. */

Object.keys(_ARTSRC).forEach(k => Object.defineProperty(ART, k, {
  enumerable: true,
  get(){
    const n = ++_artUid;
    return _ARTSRC[k]
      .replace(/id="([A-Za-z0-9_]+)"/g, (m,g) => 'id="'+g+'_'+n+'"')
      .replace(/url\(#([A-Za-z0-9_]+)\)/g, (m,g) => 'url(#'+g+'_'+n+')');
  }
}));

/* every utterance the app can ever make — the render script calls this */
function allSpeech(){
  const seen = {}, out = [];
  const add = (t,v) => { if(t && !seen[t]){ seen[t]=1; out.push({t:t, v:v}); } };
  const names = [];
  Object.keys(ANIMALS).forEach(k => ANIMALS[k].names.forEach(n => names.push(n)));
  Object.keys(LINE).forEach(k => {
    const t = LINE[k], v = LINE_VOICE[k] || 'narr';
    if(t.indexOf('{n}') >= 0) names.forEach(n => add(t.replace('{n}', n), v));
    else add(t, v);
  });
  Object.keys(WORDS).forEach(k => {
    const w = WORDS[k];
    add(w.reveal, 'slow');
    add(w.reveal2, 'pal');
    add('Your turn! Can you say ' + w.en + '?', 'pal');
    add('In Spanish, we say ' + w.es + '.', 'slow');
    add(w.en, 'slow');
    add('In Spanish, ' + w.es, 'slow');
  });
  add('Who wants to come with you today?', 'pal');
  names.forEach(n => add('Hooray! My name is ' + n + '!', 'pal'));
  Object.keys(ANIMALS).forEach(k => add('What shall we call your ' + ANIMALS[k].label.toLowerCase() + '?', 'pal'));
  return out;
}

/* =========================================================
   MUSIC — generated live, so there is no track to licence
   ========================================================= */
const Music = {
  ctx:null, master:null, verb:null, timer:null, step:0, started:false,
  base:0.062, gap:620,
  scale:[261.63,293.66,329.63,392.00,440.00,523.25],
  pattern:[0,2,4,2,1,3,5,3,0,4,2,0,1,3,4,2],
  async start(){
    if(this.started) return;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      if(this.ctx.state === 'suspended') await this.ctx.resume();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.base;
      const len = Math.floor(this.ctx.sampleRate * 2.4);
      const buf = this.ctx.createBuffer(2, len, this.ctx.sampleRate);
      for(let c=0;c<2;c++){ const d = buf.getChannelData(c);
        for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.8); }
      this.verb = this.ctx.createConvolver(); this.verb.buffer = buf;
      const vg = this.ctx.createGain(); vg.gain.value = 0.42;
      this.verb.connect(vg); vg.connect(this.master);
      this.master.connect(this.ctx.destination);
      const pf = this.ctx.createBiquadFilter(); pf.type='lowpass'; pf.frequency.value=620;
      const pg = this.ctx.createGain(); pg.gain.value = 0.05;
      [130.81, 196.00].forEach(hz => {
        [hz, hz*1.005].forEach(f => {
          const o = this.ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
          o.connect(pf); o.start();
        });
      });
      pf.connect(pg); pg.connect(this.master);
      this.started = true;
      this.tick();
    }catch(e){}
  },
  note(hz, when, dur, vol){
    const o = this.ctx.createOscillator(); o.type='triangle'; o.frequency.value=hz;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    const f = this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=2400;
    o.connect(f); f.connect(g); g.connect(this.master); g.connect(this.verb);
    o.start(when); o.stop(when+dur+0.06);
  },
  tick(){
    if(!this.started) return;
    const t = this.ctx.currentTime + 0.06;
    const i = this.pattern[this.step % this.pattern.length];
    this.note(this.scale[i % this.scale.length], t, 1.6, 0.09);
    if(this.step % 4 === 0) this.note(this.scale[0]/2, t, 2.4, 0.055);
    this.step++;
    this.timer = setTimeout(() => this.tick(), this.gap);
  },
  mood(m){
    if(m === 'tense'){ this.scale=[220.00,261.63,293.66,329.63,392.00]; this.gap=850; }
    else if(m === 'happy'){ this.scale=[261.63,329.63,392.00,440.00,523.25,659.25]; this.gap=520; }
    else { this.scale=[261.63,293.66,329.63,392.00,440.00,523.25]; this.gap=620; }
  },
  duck(on){
    if(!this.started) return;
    const g = this.master.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(on ? this.base*0.3 : this.base, t + 0.28);
  }
};

/* =========================================================
   AUDIO — pre-rendered narration, browser TTS as fallback
   ========================================================= */
const AUD = {ok:false, map:{}, cache:{}};
async function loadAudio(){
  try{
    const r = await fetch('audio/manifest.json', {cache:'force-cache'});
    if(r.ok){ AUD.map = await r.json(); AUD.ok = Object.keys(AUD.map).length > 0; warmAudio(); }
  }catch(e){}
}
/* quietly pull the clips into cache a few at a time so nothing stutters mid-story */
function warmAudio(){
  const files = Object.keys(AUD.map).map(k => AUD.map[k]);
  let i = 0;
  (function next(){
    for(let n = 0; n < 4 && i < files.length; n++, i++){
      const f = files[i];
      if(AUD.cache[f]) continue;
      const a = new Audio('audio/' + f); a.preload = 'auto';
      AUD.cache[f] = a;
    }
    if(i < files.length) setTimeout(next, 260);
  })();
}
function playClip(file){
  return new Promise(res => {
    let a = AUD.cache[file];
    if(!a){ a = new Audio('audio/' + file); a.preload = 'auto'; AUD.cache[file] = a; }
    try{ a.currentTime = 0; }catch(e){}
    Music.duck(true);
    let done = false;
    const fin = () => { if(done) return; done = true;
      a.onended = null; a.onerror = null; clearTimeout(tm); Music.duck(false); res(); };
    const tm = setTimeout(fin, 30000);
    a.onended = fin; a.onerror = fin;
    const pr = a.play();
    if(pr && pr.catch) pr.catch(fin);
  });
}

let VOICE = null, voicesReady = false;
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const en = vs.filter(v => /^en(-|_|$)/i.test(v.lang));
  const pref = ['Samantha','Karen','Serena','Moira','Tessa','Google UK English Female','Google US English','Microsoft Zira','Fiona'];
  VOICE = en.find(v => pref.some(p => v.name.indexOf(p) >= 0)) || en[0] || vs[0];
  voicesReady = true;
}
loadVoices();
if(typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;

function webSpeak(text, opt){
  opt = opt || {};
  return new Promise(res => {
    if(!('speechSynthesis' in window)){ setTimeout(res, Math.min(4000, text.length*55)); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    if(VOICE) u.voice = VOICE;
    u.rate  = opt.rate  != null ? opt.rate  : .84;
    u.pitch = opt.pitch != null ? opt.pitch : 1;
    u.volume = 1;
    let done = false;
    const finish = () => { if(done) return; done = true; clearTimeout(t); res(); };
    u.onend = finish; u.onerror = finish;
    // iOS sometimes never fires onend — hard fallback
    const t = setTimeout(finish, 1600 + text.length * 105);
    try{ speechSynthesis.speak(u); }catch(e){ finish(); }
  });
}
function speak(text, opt){
  const f = AUD.ok && AUD.map[text];
  if(f) return playClip(f);
  return webSpeak(text, opt);
}

/* ============================================================
   MIC  (loudness only — no recognition, works in any accent)
   ============================================================ */
const Mic = {
  ready:false, ctx:null, an:null, buf:null,
  async init(){
    if(this.ready) return true;
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      // never let a hanging / ignored permission prompt block the app
      const stream = await Promise.race([
        navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}),
        new Promise((_,rej) => setTimeout(() => rej(new Error('mic timeout')), 8000))
      ]);
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      if(this.ctx.state === 'suspended') await this.ctx.resume();
      const src = this.ctx.createMediaStreamSource(stream);
      this.an = this.ctx.createAnalyser();
      this.an.fftSize = 1024;
      src.connect(this.an);
      this.buf = new Uint8Array(this.an.fftSize);
      this.ready = true;
      return true;
    }catch(e){ this.ready = false; return false; }
  },
  level(){
    if(!this.ready) return 0;
    this.an.getByteTimeDomainData(this.buf);
    let s = 0;
    for(let i=0;i<this.buf.length;i++){ const v=(this.buf[i]-128)/128; s += v*v; }
    return Math.sqrt(s/this.buf.length);
  }
};

// Resolves true if a sustained sound is heard, false on timeout.
function listenForVoice(ms, opts){
  opts = opts || {};
  const needMs = opts.needMs || 130;
  const gain   = opts.gain   || 2.4;
  const floor  = opts.floor  || .05;
  return new Promise(res => {
    if(!Mic.ready){ setTimeout(()=>res(false), ms); return; }
    let base = 0, n = 0, hot = 0, t0 = performance.now(), last = t0, settled = false;
    const bar = $('lvl');
    function frame(){
      if(settled) return;
      const now = performance.now(), dt = now - last; last = now;
      const lv = Mic.level();
      if(now - t0 < 420){ base = (base*n + lv)/(n+1); n++; }       // calibrate ambient
      else {
        const thr = Math.max(base*gain, floor);
        if(bar){
          const p = Math.min(1, lv / (thr*1.7));
          bar.style.opacity = p > .12 ? '1' : '0';
          bar.style.transform = 'scale(' + (0.5 + p*0.55) + ')';
        }
        if(lv > thr) hot += dt; else hot = Math.max(0, hot - dt*0.7);
        if(hot >= needMs){ settled = true; if(bar) bar.style.opacity='0'; return res(true); }
      }
      if(now - t0 > ms){ settled = true; if(bar) bar.style.opacity='0'; return res(false); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
// any tap on the picture also counts
function tapOrVoice(ms, opts){
  return new Promise(res => {
    let done = false;
    const taps = [$('wordPic'), $('micDot')];
    const onTap = () => { if(done) return; done = true; cleanup(); res(true); };
    function cleanup(){ taps.forEach(t => t && t.removeEventListener('pointerdown', onTap)); }
    taps.forEach(t => t && t.addEventListener('pointerdown', onTap));
    listenForVoice(ms, opts).then(v => { if(done) return; done = true; cleanup(); res(v); });
  });
}

  await shot({bg:'meadow', sky:true, items:[
    {a:ART.roof, l:'-3%', b:'-1%', w:420, anim:'rise', z:2},
    {a:ART.chimney, l:'50%', ml:-52, b:'15%', w:104, anim:'rise', z:3},
    {a:ART.wolf, l:'6%', b:'5%', w:112, cls:'climb', z:4, id:'wolfRoof'},
    pal({r:'5%', b:'4%', w:86, z:5})
  ]});
  await wordMoment('chimney');
  if(stopFlag) return;
  await line(LINE.climb, V.narr);
  if(el('wolfRoof')) el('wolfRoof').classList.add('shootOut');
  await wait(700);
  if(stopFlag) return;

  /* ---- 10. INSIDE — the pot ---- */
  await shot({bg:'room', sky:false, items:[
    {a:ART.fire, l:'50%', ml:-66, b:'18%', w:132, anim:'fade', z:2},
    {a:ART.pot, l:'50%', ml:-66, b:'20%', w:132, anim:'rise', z:5, id:'thePot'},
    {a:ART.pig, l:'2%', b:'15%', w:74, cls:'brz', z:6},
    {a:ART.pig, r:'2%', b:'15%', w:74, cls:'brz', z:6},
    pal({l:'50%', ml:-38, b:'0%', w:78, z:7})
  ]});
  await wordMoment('pot');
  if(stopFlag) return;
  await line(LINE.waiting, V.narr);
  if(stopFlag) return;
  // the wolf falls down the chimney into the pot
  addItems([{a:ART.wolf, l:'50%', ml:-48, b:'26%', w:96, anim:'fade', z:3, id:'wolfDrop'}]);
  if(el('wolfDrop')) el('wolfDrop').firstChild.classList.add('dropIn');
  await wait(980);
  addItems([{a:ART.splash, l:'50%', ml:-96, b:'27%', w:192, anim:'pop', z:8, id:'splash'}]);
  await line(LINE.splash, V.narr);
  if(el('wolfDrop')) el('wolfDrop').classList.add('shootOut');
  await wait(500);
  if(el('splash')) el('splash').remove();
  if(stopFlag) return;
  await line(LINE.ranOut, V.narr);
  if(el('wolfDrop')) el('wolfDrop').remove();
  if(stopFlag) return;

  /* ---- 11. FINALE — daylight, no pot, everyone celebrating ---- */
  Music.mood('happy');
  await shot(meadow([
    {a:ART.star, l:'50%', ml:-70, b:'58%', w:140, cls:'spin', anim:'pop', z:0},
    {a:ART.bricks, l:'50%', ml:-56, b:'40%', w:112, anim:'rise', z:1},
    {a:ART.note1, l:'16%', b:'56%', w:26, cls:'float', anim:'fade', z:2},
    {a:ART.note2, r:'18%', b:'62%', w:22, cls:'float', anim:'fade', z:2},
    {a:ART.note3, l:'34%', b:'66%', w:20, cls:'float', anim:'fade', z:2},
    {a:ART.pig, l:'8%',  b:'14%', w:58, cls:'cheer', anim:'pop', d:0,   z:4},
    {a:ART.pig, l:'36%', b:'14%', w:58, cls:'cheer', anim:'pop', d:150, z:4},
    {a:ART.pig, r:'8%',  b:'14%', w:58, cls:'cheer', anim:'pop', d:300, z:4},
    pal({l:'50%', ml:-36, b:'2%', w:72, z:5})
  ]));
  await line(LINE.end, V.narr);
  if(stopFlag) return;
  await line(LINE.thanks, V.pal);
  if(stopFlag) return;
  openBook();
}

/* ============================================================
   BOOK
   ============================================================ */
function openBook(){
  stopFlag = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  $('bookPal').innerHTML = ART[S.pal];
  $('bookTitle').textContent = S.name + '’s Word Book';
  $('bookSub').textContent = S.learned.length + ' of ' + WORD_ORDER.length + ' words learned · tap to hear again';
  const g = $('cardGrid'); g.innerHTML = '';
  WORD_ORDER.forEach(k => {
    const w = WORDS[k], got = S.learned.indexOf(k) >= 0;
    const b = document.createElement('button');
    b.className = 'kc' + (got ? '' : ' locked');
    b.innerHTML = (got ? ART[w.art] : '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#E4DBC8"/><text x="20" y="27" text-anchor="middle" font-size="19" fill="#BCAF98">?</text></svg>')
      + '<div class="w">' + (got ? w.en : '???') + '</div>'
      + '<div class="e">' + (got ? w.es : '') + '</div>';
    if(got) b.onclick = async () => { await speak(w.en, {rate:.7}); await speak('In Spanish, ' + w.es, {rate:.74}); };
    g.appendChild(b);
  });
  goTo('sBook');
}

/* ============================================================
   NAV
   ============================================================ */
function goTo(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

function buildAnimalGrid(){
  const g = $('animalGrid'); g.innerHTML = '';
  Object.keys(ANIMALS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'animBtn';
    b.innerHTML = ART[k] + '<span>' + ANIMALS[k].label + '</span>';
    b.onclick = async () => {
      S.pal = k; save();
      buildNameScreen();
      goTo('sName');
      speak('What shall we call your ' + ANIMALS[k].label.toLowerCase() + '?', {rate:.86});
    };
    g.appendChild(b);
  });
}
function buildNameScreen(){
  $('namePal').innerHTML = ART[S.pal];
  const c = $('nameCol'); c.innerHTML = '';
  ANIMALS[S.pal].names.forEach(n => {
    const b = document.createElement('button');
    b.className = 'nameBtn'; b.textContent = n;
    b.onclick = async () => {
      S.name = n; save();
      initStage();
      goTo('sStory');
      narrate('…');
      await speak('Hooray! My name is ' + n + '!', {pitch:1.55, rate:.9});
      runStory();
    };
    c.appendChild(b);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
$('titlePal').innerHTML = ART[S.pal];
if(S.learned.length) $('resetBtn').style.display = 'block';

$('startBtn').onclick = async () => {
  // unlock audio inside the user gesture (iOS requirement)
  try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
  if(!voicesReady) loadVoices();
  Mic.init();      // fire inside the gesture so the prompt shows — but never wait for it
  Music.start();   // audio contexts may only start from a gesture
  loadAudio();
  initStage();
  buildAnimalGrid();
  goTo('sPick');
  speak('Who wants to come with you today?', {rate:.86});
};
$('resetBtn').onclick = () => {
  S.learned = []; save();
  $('resetBtn').style.display = 'none';
  alert('Cleared — Bobo has forgotten all the words.');
};
$('bookBtn').onclick = openBook;
$('againBtn').onclick = () => { initStage(); goTo('sStory'); runStory(); };
$('homeBtn').onclick = () => {
  stopFlag = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  $('titlePal').innerHTML = ART[S.pal];
  if(S.learned.length) $('resetBtn').style.display = 'block';
  goTo('sTitle');
};
$('skip').onclick = () => {
  try{ speechSynthesis.cancel(); }catch(e){}   // cuts the current line; story continues
};
$('micDot').onclick = () => {};

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ try{ speechSynthesis.cancel(); }catch(e){} }
});
</script>
