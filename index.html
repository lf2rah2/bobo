<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8ECBE6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 72'%3E%3Cellipse cx='20' cy='18' rx='7' ry='17' fill='%23F0E2D2'/%3E%3Cellipse cx='40' cy='18' rx='7' ry='17' fill='%23F0E2D2'/%3E%3Cellipse cx='30' cy='44' rx='21' ry='19' fill='%23FBF1E4'/%3E%3Ccircle cx='23' cy='41' r='3.4' fill='%232E241C'/%3E%3Ccircle cx='37' cy='41' r='3.4' fill='%232E241C'/%3E%3C/svg%3E">
<title>Help Bobo Learn — The Three Little Pigs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Fredoka',-apple-system,system-ui,sans-serif;
  background:#0E1518;color:#22303A;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
#root{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:#BFE3F5;overflow:hidden}

.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ============ TITLE ============ */
#sTitle{background:linear-gradient(#8ECBE6 0%,#BFE3F5 45%,#A8D98E 45%,#8FC978 100%);align-items:center;justify-content:center;text-align:center;padding:28px}
#sTitle h1{font-size:clamp(30px,8.4vw,44px);font-weight:700;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.13);line-height:1.12;margin-bottom:6px}
#sTitle .sub{font-size:16px;color:#3B5A47;font-weight:500;margin-bottom:26px}
.bigBtn{
  background:#E2694C;color:#fff;border:none;border-radius:999px;
  font-family:inherit;font-size:23px;font-weight:600;padding:20px 46px;
  box-shadow:0 7px 0 #B94F36;transition:transform .1s,box-shadow .1s;
}
.bigBtn:active{transform:translateY(5px);box-shadow:0 2px 0 #B94F36}
.tiny{margin-top:22px;font-size:12.5px;color:#4B6B57;font-weight:400;max-width:270px;line-height:1.45}
.linkish{margin-top:16px;font-size:13px;color:#4B6B57;text-decoration:underline;background:none;border:none;font-family:inherit}

/* ============ PICKERS ============ */
.pickWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(#8ECBE6 0%,#C6E7F6 46%,#A8D98E 46%,#8FC978 100%)}
.pickTitle{font-size:25px;font-weight:600;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.13);margin-bottom:24px;text-align:center;line-height:1.2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:100%;max-width:340px}
.animBtn{
  background:rgba(255,255,255,.92);border:4px solid transparent;border-radius:24px;
  padding:14px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:inherit;font-size:16px;font-weight:600;color:#3B4A55;
  box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .12s;
}
.animBtn:active{transform:scale(.94)}
.animBtn.sel{border-color:#E2694C}
.animBtn svg{width:74px;height:80px}
.nameBtn{
  background:rgba(255,255,255,.94);border:none;border-radius:20px;padding:19px 10px;
  font-family:inherit;font-size:22px;font-weight:600;color:#3B4A55;
  box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .12s;width:100%;
}
.nameBtn:active{transform:scale(.95)}
.nameCol{display:grid;gap:13px;width:100%;max-width:280px}
.palPreview{width:120px;height:132px;margin-bottom:14px}

/* ============ STORY ============ */
#stage{flex:1;position:relative;overflow:hidden;background:#BFE3F5;transition:background .9s}
.sky{position:absolute;inset:0;background:linear-gradient(#8ECBE6,#C9E9F7);transition:1s}
.sky.night{background:linear-gradient(#4A5A78,#8B7B92)}
.hills{position:absolute;left:-12%;right:-12%;bottom:44%;height:16%;background:#A5D48F;border-radius:50% 50% 0 0/100% 100% 0 0}
.hills::after{content:"";position:absolute;left:38%;right:-6%;bottom:0;height:82%;background:#9ACB83;border-radius:50% 50% 0 0/100% 100% 0 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:50%;background:#8FC978;border-radius:46% 46% 0 0/9% 9% 0 0}
.ground::after{content:"";position:absolute;left:0;right:0;top:9%;bottom:0;background:#8FC978}
.sun{position:absolute;top:15%;right:13%;width:52px;height:52px;border-radius:50%;background:#FFE27A;box-shadow:0 0 0 10px rgba(255,226,122,.28);transition:.9s}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9}
.c1{width:74px;height:26px;top:9%;left:8%;animation:drift 26s linear infinite}
.c2{width:52px;height:20px;top:26%;left:56%;animation:drift 34s linear infinite}
@keyframes drift{0%{transform:translateX(-14px)}50%{transform:translateX(20px)}100%{transform:translateX(-14px)}}

.obj{position:absolute;opacity:0;transform:translateY(10px);transition:opacity .55s,transform .55s cubic-bezier(.34,1.5,.64,1);pointer-events:none}
.obj.on{opacity:1;transform:none}
.obj.blown{opacity:0!important;transform:translateX(120px) rotate(52deg) scale(.5)!important;transition:.85s cubic-bezier(.4,0,.7,1)}
.hop{animation:hop 1.5s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.shake{animation:shk .3s ease-in-out 6}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.glow{filter:drop-shadow(0 0 0 rgba(255,220,90,0));animation:glowA 1.1s ease-in-out infinite}
@keyframes glowA{0%,100%{filter:drop-shadow(0 0 3px rgba(255,220,90,.5))}50%{filter:drop-shadow(0 0 16px rgba(255,220,90,1))}}

#pal{position:absolute;left:4%;bottom:4%;width:104px;height:115px;z-index:6;transition:.45s;filter:drop-shadow(0 3px 3px rgba(60,45,30,.3))}
#pal.excited{animation:hop .55s ease-in-out infinite}
#pal.hide{opacity:0;transform:translateY(20px)}

#bookBtn{
  position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:12;
  background:rgba(255,255,255,.95);border:none;border-radius:16px;padding:8px 12px;
  display:flex;align-items:center;gap:6px;font-family:inherit;font-size:15px;font-weight:600;color:#3B4A55;
  box-shadow:0 3px 8px rgba(0,0,0,.18);
}
#bookBtn.bump{animation:bump .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes bump{0%,100%{transform:scale(1)}45%{transform:scale(1.3)}}

#bar{
  flex-shrink:0;background:#fff;border-radius:26px 26px 0 0;padding:16px 20px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(0,0,0,.13);min-height:118px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:8;
}
#narr{font-size:19px;line-height:1.36;font-weight:500;color:#28353E;text-align:center}
#skip{position:absolute;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));background:none;border:none;font-family:inherit;font-size:12px;color:#B9C4CC;padding:8px 10px}

/* ============ WORD MOMENT ============ */
#word{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:22px;background:rgba(18,30,38,.72);backdrop-filter:blur(4px)}
#word.on{display:flex;animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#wordCard{
  background:#fff;border-radius:34px;padding:22px 26px 26px;text-align:center;width:100%;max-width:330px;
  box-shadow:0 22px 50px rgba(0,0,0,.45);transform:scale(.7);opacity:0;transition:.5s cubic-bezier(.34,1.6,.64,1);
}
#wordCard.in{transform:none;opacity:1}
#wordPic{width:150px;height:150px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#F4EFE3;transition:.3s}
#wordPic:active{transform:scale(.93)}
#wordPic svg{width:112px;height:112px}
#wordText{font-size:44px;font-weight:700;color:#28353E;letter-spacing:-.5px;line-height:1}
#wordEs{font-size:16px;font-weight:500;color:#2F7D6E;margin-top:3px;height:20px}
#wordAsk{font-size:17px;font-weight:500;color:#6B7B87;margin-top:12px;min-height:24px}
#micRing{width:96px;height:96px;margin:14px auto 0;position:relative;display:flex;align-items:center;justify-content:center}
#micDot{width:74px;height:74px;border-radius:50%;background:#E2694C;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #B94F36;transition:transform .1s}
#micDot svg{width:32px;height:32px;fill:#fff}
#micRing.live::before,#micRing.live::after{content:"";position:absolute;inset:4px;border-radius:50%;border:3px solid #E2694C;animation:mring 1.6s ease-out infinite}
#micRing.live::after{animation-delay:.8s}
@keyframes mring{0%{transform:scale(.85);opacity:.85}100%{transform:scale(1.5);opacity:0}}
#lvl{position:absolute;inset:0;border-radius:50%;border:5px solid #F2C14E;transform:scale(.5);opacity:0;transition:.12s}
#wordYay{font-size:26px;font-weight:700;color:#2F7D6E;margin-top:10px;min-height:34px;opacity:0;transition:.4s}
#wordYay.in{opacity:1}
.flyCard{position:fixed;z-index:40;width:82px;height:82px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.35);pointer-events:none}
.flyCard svg{width:56px;height:56px}

/* ============ BOOK ============ */
#sBook{background:linear-gradient(#F7EFDF,#EADCC2);overflow-y:auto}
.bookIn{padding:calc(26px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
.bookIn h2{font-size:27px;font-weight:700;color:#3B4A55;margin-bottom:4px}
.bookIn .s{font-size:15px;color:#7C8A93;margin-bottom:20px;font-weight:400}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:24px}
.kc{background:#fff;border-radius:18px;padding:11px 5px 9px;box-shadow:0 4px 0 rgba(0,0,0,.09);transition:transform .12s;border:none;font-family:inherit}
.kc:active{transform:scale(.93)}
.kc svg{width:50px;height:50px}
.kc .w{font-size:14px;font-weight:600;color:#3B4A55;margin-top:3px}
.kc .e{font-size:10.5px;font-weight:500;color:#2F7D6E}
.kc.locked{background:rgba(255,255,255,.45);box-shadow:none}
.kc.locked .w,.kc.locked .e{color:#BCAF98}
</style>
</head>
<body>
<div id="root">

  <!-- ================= TITLE ================= -->
  <section class="screen on" id="sTitle">
    <div style="width:132px;height:146px;margin-bottom:14px" id="titlePal"></div>
    <h1>Help Bobo Learn</h1>
    <div class="sub">The Three Little Pigs</div>
    <button class="bigBtn" id="startBtn">Start</button>
    <p class="tiny">Best with sound on. We’ll ask for the microphone so Bobo can hear your little one — tapping the picture always works too.</p>
    <button class="linkish" id="resetBtn" style="display:none">Start over (clear Bobo’s words)</button>
  </section>

  <!-- ================= PICK ANIMAL ================= -->
  <section class="screen" id="sPick">
    <div class="pickWrap">
      <div class="pickTitle">Who wants to<br>come with you?</div>
      <div class="grid2" id="animalGrid"></div>
    </div>
  </section>

  <!-- ================= PICK NAME ================= -->
  <section class="screen" id="sName">
    <div class="pickWrap">
      <div class="palPreview" id="namePal"></div>
      <div class="pickTitle" style="margin-bottom:18px">What shall we<br>call them?</div>
      <div class="nameCol" id="nameCol"></div>
    </div>
  </section>

  <!-- ================= STORY ================= -->
  <section class="screen" id="sStory">
    <div id="stage">
      <div class="sky" id="sky"></div>
      <div class="sun" id="sun"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="hills"></div>
      <div class="ground"></div>
      <svg class="bush" viewBox="0 0 60 34" style="position:absolute;left:26%;bottom:47%;width:56px;height:32px"><ellipse cx="16" cy="24" rx="16" ry="12" fill="#7BB868"/><ellipse cx="34" cy="20" rx="19" ry="15" fill="#6FAC5D"/><ellipse cx="48" cy="26" rx="12" ry="9" fill="#7BB868"/></svg>
      <svg class="bush" viewBox="0 0 60 34" style="position:absolute;right:30%;bottom:45%;width:44px;height:25px"><ellipse cx="18" cy="24" rx="17" ry="12" fill="#6FAC5D"/><ellipse cx="38" cy="21" rx="16" ry="13" fill="#7BB868"/></svg>
      <button id="bookBtn"><span>📖</span><span id="bookCount">0</span></button>
      <div class="obj" id="oStraw"></div>
      <div class="obj" id="oStick"></div>
      <div class="obj" id="oBrick"></div>
      <div class="obj" id="oPig1"></div>
      <div class="obj" id="oPig2"></div>
      <div class="obj" id="oPig3"></div>
      <div class="obj" id="oWolf"></div>
      <div class="obj" id="oPot"></div>
      <div class="obj" id="oPuff"></div>
      <div id="pal"></div>
    </div>
    <div id="bar">
      <div id="narr">…</div>
      <button id="skip">skip ›</button>
    </div>

    <div id="word">
      <div id="wordCard">
        <div id="wordPic"></div>
        <div id="wordText">wolf</div>
        <div id="wordEs"></div>
        <div id="wordAsk">Can you say it?</div>
        <div id="micRing"><div id="lvl"></div><div id="micDot"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15z"/><path d="M18.5 11.5a.9.9 0 0 0-1.8 0 4.7 4.7 0 0 1-9.4 0 .9.9 0 0 0-1.8 0 6.5 6.5 0 0 0 5.6 6.4V21h-2a.9.9 0 0 0 0 1.8h5.8a.9.9 0 0 0 0-1.8h-2v-3.1a6.5 6.5 0 0 0 5.6-6.4z"/></svg></div></div>
        <div id="wordYay">Yay!</div>
      </div>
    </div>
  </section>

  <!-- ================= BOOK ================= -->
  <section class="screen" id="sBook">
    <div class="bookIn">
      <div style="width:104px;height:114px;margin:0 auto 10px" id="bookPal"></div>
      <h2 id="bookTitle">Bobo’s Word Book</h2>
      <div class="s" id="bookSub">Tap a card to hear it again</div>
      <div class="cards" id="cardGrid"></div>
      <button class="bigBtn" id="againBtn" style="font-size:19px;padding:16px 34px">Read it again</button>
      <button class="linkish" id="homeBtn">Back to start</button>
    </div>
  </section>

</div>

<script>

   ART
   ============================================================ */

  straw:`<svg viewBox="0 0 96 88"><path d="M48 6 92 40H4z" fill="#E8C25A"/><rect x="14" y="40" width="68" height="44" fill="#F2D375"/><path d="M14 48h68M14 57h68M14 66h68M14 75h68" stroke="#DFB94E" stroke-width="2.4"/><path d="M20 40l8-14M36 40l8-14M52 40l8-14M68 40l8-14" stroke="#DFB94E" stroke-width="2"/><rect x="38" y="58" width="20" height="26" rx="2" fill="#B98C36"/></svg>`,

/* ============================================================
   WORDS  (7 knowledge cards)
   ============================================================ */
const WORDS = {
  pig:     {en:'pig',     es:'el cerdito', art:'pig'},
  straw:   {en:'straw',   es:'la paja',    art:'straw'},
  sticks:  {en:'sticks',  es:'los palos',  art:'sticks'},
  bricks:  {en:'bricks',  es:'los ladrillos', art:'bricks'},
  wolf:    {en:'wolf',    es:'el lobo',    art:'wolf'},
  chimney: {en:'chimney', es:'la chimenea',art:'chimney'},
  pot:     {en:'pot',     es:'la olla',    art:'pot'}
};
const WORD_ORDER = ['pig','straw','sticks','bricks','wolf','chimney','pot'];

const ANIMALS = {
  bunny:{label:'Bunny', names:['Bobo','Nibbles','Pip']},
  bear: {label:'Bear',  names:['Bruno','Honey','Tumble']},
  duck: {label:'Duck',  names:['Ducky','Splash','Momo']},
  cat:  {label:'Cat',   names:['Mimi','Pounce','Whiskers']}
};

/* ============================================================
   STATE
   ============================================================ */
const $ = id => document.getElementById(id);
const LS = 'boboPoc.v1';
let S = {pal:'bunny', name:'Bobo', learned:[]};
try{ const raw = localStorage.getItem(LS); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} };

let stopFlag = false, skipFlag = false;

/* ============================================================
   SPEECH OUT
   ============================================================ */
let VOICE = null, voicesReady = false;
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  if(!vs.length) return;
  const en = vs.filter(v => /^en(-|_|$)/i.test(v.lang));
  const pref = ['Samantha','Karen','Serena','Moira','Tessa','Google UK English Female','Google US English','Microsoft Zira','Fiona'];
  VOICE = en.find(v => pref.some(p => v.name.indexOf(p) >= 0)) || en[0] || vs[0];
  voicesReady = true;
}
loadVoices();
if(typeof speechSynthesis !== 'undefined') speechSynthesis.onvoiceschanged = loadVoices;

function speak(text, opt){
  opt = opt || {};
  return new Promise(res => {
    if(!('speechSynthesis' in window)){ setTimeout(res, Math.min(4000, text.length*55)); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    if(VOICE) u.voice = VOICE;
    u.rate  = opt.rate  != null ? opt.rate  : .84;
    u.pitch = opt.pitch != null ? opt.pitch : 1;
    u.volume = 1;
    let done = false;
    const finish = () => { if(done) return; done = true; clearTimeout(t); res(); };
    u.onend = finish; u.onerror = finish;
    // iOS sometimes never fires onend — hard fallback
    const t = setTimeout(finish, 1600 + text.length * 105);
    try{ speechSynthesis.speak(u); }catch(e){ finish(); }
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   MIC  (loudness only — no recognition, works in any accent)
   ============================================================ */
const Mic = {
  ready:false, ctx:null, an:null, buf:null,
  async init(){
    if(this.ready) return true;
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
      // never let a hanging / ignored permission prompt block the app
      const stream = await Promise.race([
        navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true, autoGainControl:true}}),
        new Promise((_,rej) => setTimeout(() => rej(new Error('mic timeout')), 8000))
      ]);
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      if(this.ctx.state === 'suspended') await this.ctx.resume();
      const src = this.ctx.createMediaStreamSource(stream);
      this.an = this.ctx.createAnalyser();
      this.an.fftSize = 1024;
      src.connect(this.an);
      this.buf = new Uint8Array(this.an.fftSize);
      this.ready = true;
      return true;
    }catch(e){ this.ready = false; return false; }
  },
  level(){
    if(!this.ready) return 0;
    this.an.getByteTimeDomainData(this.buf);
    let s = 0;
    for(let i=0;i<this.buf.length;i++){ const v=(this.buf[i]-128)/128; s += v*v; }
    return Math.sqrt(s/this.buf.length);
  }
};

// Resolves true if a sustained sound is heard, false on timeout.
function listenForVoice(ms, opts){
  opts = opts || {};
  const needMs = opts.needMs || 130;
  const gain   = opts.gain   || 2.4;
  const floor  = opts.floor  || .05;
  return new Promise(res => {
    if(!Mic.ready){ setTimeout(()=>res(false), ms); return; }
    let base = 0, n = 0, hot = 0, t0 = performance.now(), last = t0, settled = false;
    const bar = $('lvl');
    function frame(){
      if(settled) return;
      const now = performance.now(), dt = now - last; last = now;
      const lv = Mic.level();
      if(now - t0 < 420){ base = (base*n + lv)/(n+1); n++; }       // calibrate ambient
      else {
        const thr = Math.max(base*gain, floor);
        if(bar){
          const p = Math.min(1, lv / (thr*1.7));
          bar.style.opacity = p > .12 ? '1' : '0';
          bar.style.transform = 'scale(' + (0.5 + p*0.55) + ')';
        }
        if(lv > thr) hot += dt; else hot = Math.max(0, hot - dt*0.7);
        if(hot >= needMs){ settled = true; if(bar) bar.style.opacity='0'; return res(true); }
      }
      if(now - t0 > ms){ settled = true; if(bar) bar.style.opacity='0'; return res(false); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
// any tap on the picture also counts
function tapOrVoice(ms, opts){
  return new Promise(res => {
    let done = false;
    const taps = [$('wordPic'), $('micDot')];
    const onTap = () => { if(done) return; done = true; cleanup(); res(true); };
    function cleanup(){ taps.forEach(t => t && t.removeEventListener('pointerdown', onTap)); }
    taps.forEach(t => t && t.addEventListener('pointerdown', onTap));
    listenForVoice(ms, opts).then(v => { if(done) return; done = true; cleanup(); res(v); });
  });
}

/* ============================================================
   STAGE HELPERS
   ============================================================ */
function show(id, yes){ const e = $(id); if(e) e.classList.toggle('on', yes !== false); }
function hideAll(){ ['oStraw','oStick','oBrick','oPig1','oPig2','oPig3','oWolf','oPot','oPuff']
  .forEach(i => { const e=$(i); e.classList.remove('on','blown','shake','glow'); }); }
function narrate(t){ $('narr').textContent = t; }
async function line(text, opt){ narrate(text); await speak(text, opt); if(!skipFlag) await wait(260); }
function palSay(){ $('pal').classList.add('excited'); }
function palCalm(){ $('pal').classList.remove('excited'); }

function buildStage(){
  $('oStraw').innerHTML = ART.straw; $('oStraw').style.cssText = 'left:2%;bottom:36%;width:104px;height:95px';
  $('oStick').innerHTML = ART.sticks; $('oStick').style.cssText = 'left:35%;bottom:36%;width:104px;height:95px';
  $('oBrick').innerHTML = ART.bricks; $('oBrick').style.cssText = 'right:2%;bottom:36%;width:104px;height:95px';
  $('oPig1').innerHTML = ART.pig; $('oPig1').style.cssText = 'left:13%;bottom:25%;width:60px;height:57px';
  $('oPig2').innerHTML = ART.pig; $('oPig2').style.cssText = 'left:44%;bottom:25%;width:60px;height:57px';
  $('oPig3').innerHTML = ART.pig; $('oPig3').style.cssText = 'right:13%;bottom:25%;width:60px;height:57px';
  $('oWolf').innerHTML  = ART.wolf; $('oWolf').style.cssText = 'right:4%;bottom:5%;width:94px;height:99px';
  $('oPot').innerHTML   = ART.pot;  $('oPot').style.cssText  += 'left:50%;margin-left:-50px;bottom:22%;width:100px;height:96px';
  $('oPuff').innerHTML  = ART.puff; $('oPuff').style.cssText = 'right:27%;bottom:52%;width:96px;height:52px';
  $('pal').innerHTML = ART[S.pal];
}

/* ============================================================
   WORD MOMENT — the child repeats ONE word to teach the pal
   ============================================================ */
function flyCardToBook(){
  const card = document.createElement('div');
  card.className = 'flyCard';
  const w = WORDS[flyCardToBook.key] || WORDS.pig;
  card.innerHTML = ART[w.art];
  const from = $('wordPic').getBoundingClientRect();
  const to   = $('bookBtn').getBoundingClientRect();
  card.style.left = (from.left + from.width/2 - 41) + 'px';
  card.style.top  = (from.top  + from.height/2 - 41) + 'px';
  document.body.appendChild(card);
  requestAnimationFrame(() => {
    card.style.transition = 'transform .85s cubic-bezier(.5,0,.7,1), opacity .85s';
    const dx = (to.left + to.width/2) - (from.left + from.width/2);
    const dy = (to.top  + to.height/2) - (from.top  + from.height/2);
    card.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.22)';
    card.style.opacity = '.5';
  });
  setTimeout(() => {
    card.remove();
    $('bookBtn').classList.add('bump');
    setTimeout(()=>$('bookBtn').classList.remove('bump'), 520);
  }, 870);
}

async function wordMoment(key){
  if(stopFlag) return;
  const w = WORDS[key];
  const N = S.name;
  flyCardToBook.key = key;

  $('wordPic').innerHTML = ART[w.art];
  $('wordText').textContent = w.en;
  $('wordEs').textContent = '';
  $('wordYay').textContent = '';
  $('wordYay').classList.remove('in');
  $('wordAsk').textContent = '';
  $('micRing').classList.remove('live');
  $('word').classList.add('on');
  await wait(60);
  $('wordCard').classList.add('in');
  palSay();

  await line(N + ' says: ooh! What is THAT?', {pitch:1.5, rate:.9});
  if(stopFlag) return;

  $('wordAsk').textContent = 'It’s a ' + w.en + '!';
  await line('It’s a ' + w.en + '. ' + w.en + '.', {rate:.72});
  if(stopFlag) return;

  $('wordAsk').textContent = Mic.ready ? 'Your turn — say “' + w.en + '”'
                                      : 'Say it, then tap the picture';
  await line('Can you say ' + w.en + '? Say it for ' + N + '!', {pitch:1.45, rate:.88});
  if(stopFlag) return;

  $('micRing').classList.add('live');
  const heard = await tapOrVoice(6500);
  $('micRing').classList.remove('live');

  $('wordYay').textContent = heard ? 'You did it! ⭐' : w.en + '!';
  $('wordYay').classList.add('in');
  $('wordEs').textContent = w.es;

  if(heard) await line(w.en + '! You taught me! Thank you!', {pitch:1.55, rate:.92});
  else      await line(w.en + '! I will remember that one.', {pitch:1.5, rate:.9});
  if(stopFlag) return;

  await speak('In Spanish, ' + w.es + '.', {rate:.74});

  if(S.learned.indexOf(key) < 0){ S.learned.push(key); save(); }
  $('bookCount').textContent = S.learned.length;
  flyCardToBook();
  await wait(700);

  $('wordCard').classList.remove('in');
  await wait(320);
  $('word').classList.remove('on');
  palCalm();
  await wait(180);
}

/* ============================================================
   BLOW MOMENT
   ============================================================ */
async function blowMoment(){
  if(stopFlag) return;
  narrate('Blow into the phone! 💨');
  palSay();
  await speak('Then I’ll huff, and I’ll puff, and I’ll blow your house DOWN! Blow with me! Blow into the phone!', {rate:.86});
  if(stopFlag) return;
  $('oWolf').classList.add('shake');
  const blew = await listenForVoice(6000, {needMs:200, gain:2.2, floor:.055});
  $('oWolf').classList.remove('shake');
  show('oPuff', true);
  await wait(420);
  $('oStraw').classList.add('blown');
  await speak(blew ? 'WHOOOSH! You did it! The straw house blew away!' : 'WHOOOSH! The straw house blew away!', {rate:.88});
  show('oPuff', false);
  palCalm();
  await wait(240);
}

/* ============================================================
   THE STORY
   ============================================================ */
async function runStory(){
  stopFlag = false;
  hideAll();
  $('sky').classList.remove('night');
  $('bookCount').textContent = S.learned.length;
  const N = S.name;

  await line('Hello! I am ' + N + '. Let’s read a story together!', {pitch:1.5, rate:.9});
  if(stopFlag) return;
  await line('I don’t know many words yet… so can you help me learn?', {pitch:1.5, rate:.9});
  if(stopFlag) return;

  show('oPig1'); await wait(200); show('oPig2'); await wait(200); show('oPig3');
  await line('Once upon a time, there were three little pigs.');
  if(stopFlag) return;
  await wordMoment('pig');
  if(stopFlag) return;

  show('oStraw');
  await line('The first little pig built his house out of straw.');
  if(stopFlag) return;
  await wordMoment('straw');
  if(stopFlag) return;

  show('oStick');
  await line('The second little pig built his house out of sticks.');
  if(stopFlag) return;
  await wordMoment('sticks');
  if(stopFlag) return;

  show('oBrick');
  await line('And the third little pig built his house out of strong red bricks.');
  if(stopFlag) return;
  await wordMoment('bricks');
  if(stopFlag) return;

  $('sky').classList.add('night');
  show('oWolf');
  await line('But then… along came a big bad wolf!');
  if(stopFlag) return;
  await wordMoment('wolf');
  if(stopFlag) return;

  await line('The wolf knocked on the door. Little pig, little pig, let me come in!', {rate:.8});
  if(stopFlag) return;
  await line('Not by the hair of my chinny chin chin!', {pitch:1.4, rate:.86});
  if(stopFlag) return;

  await blowMoment();
  if(stopFlag) return;

  show('oPig1', false);
  await line('The first little pig ran to the house made of sticks!');
  if(stopFlag) return;
  $('oStick').classList.add('blown');
  await line('But the wolf huffed, and he puffed, and he blew that house down too!');
  if(stopFlag) return;

  show('oPig2', false);
  await line('So both little pigs ran to the house made of bricks.');
  if(stopFlag) return;
  $('oBrick').classList.add('shake');
  await line('The wolf huffed. And he puffed. And he huffed and he puffed…', {rate:.78});
  $('oBrick').classList.remove('shake');
  if(stopFlag) return;
  await line('But the brick house did NOT fall down. Bricks are too strong!');
  if(stopFlag) return;

  await wordMoment('chimney');
  if(stopFlag) return;
  await line('So the sneaky wolf climbed up onto the roof, and down the chimney!');
  if(stopFlag) return;

  show('oWolf', false);
  show('oPot');
  await line('But the clever little pigs had something waiting for him…');
  if(stopFlag) return;
  await wordMoment('pot');
  if(stopFlag) return;

  await line('SPLASH! Right into the big hot pot!');
  if(stopFlag) return;
  await line('The wolf jumped up, ran out of the door, and never ever came back!');
  if(stopFlag) return;

  $('sky').classList.remove('night');
  show('oPig1'); show('oPig2'); show('oPig3');
  await line('And the three little pigs lived happily ever after. The end!');
  if(stopFlag) return;

  await line('Look how many words you taught me! Thank you!', {pitch:1.55, rate:.92});
  if(stopFlag) return;
  openBook();
}

/* ============================================================
   BOOK
   ============================================================ */
function openBook(){
  stopFlag = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  $('bookPal').innerHTML = ART[S.pal];
  $('bookTitle').textContent = S.name + '’s Word Book';
  $('bookSub').textContent = S.learned.length + ' of ' + WORD_ORDER.length + ' words learned · tap to hear again';
  const g = $('cardGrid'); g.innerHTML = '';
  WORD_ORDER.forEach(k => {
    const w = WORDS[k], got = S.learned.indexOf(k) >= 0;
    const b = document.createElement('button');
    b.className = 'kc' + (got ? '' : ' locked');
    b.innerHTML = (got ? ART[w.art] : '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#E4DBC8"/><text x="20" y="27" text-anchor="middle" font-size="19" fill="#BCAF98">?</text></svg>')
      + '<div class="w">' + (got ? w.en : '???') + '</div>'
      + '<div class="e">' + (got ? w.es : '') + '</div>';
    if(got) b.onclick = async () => { await speak(w.en, {rate:.7}); await speak('In Spanish, ' + w.es, {rate:.74}); };
    g.appendChild(b);
  });
  goTo('sBook');
}

/* ============================================================
   NAV
   ============================================================ */
function goTo(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
}

function buildAnimalGrid(){
  const g = $('animalGrid'); g.innerHTML = '';
  Object.keys(ANIMALS).forEach(k => {
    const b = document.createElement('button');
    b.className = 'animBtn';
    b.innerHTML = ART[k] + '<span>' + ANIMALS[k].label + '</span>';
    b.onclick = async () => {
      S.pal = k; save();
      buildNameScreen();
      goTo('sName');
      speak('What shall we call your ' + ANIMALS[k].label.toLowerCase() + '?', {rate:.86});
    };
    g.appendChild(b);
  });
}
function buildNameScreen(){
  $('namePal').innerHTML = ART[S.pal];
  const c = $('nameCol'); c.innerHTML = '';
  ANIMALS[S.pal].names.forEach(n => {
    const b = document.createElement('button');
    b.className = 'nameBtn'; b.textContent = n;
    b.onclick = async () => {
      S.name = n; save();
      buildStage();
      goTo('sStory');
      narrate('…');
      await speak('Hooray! My name is ' + n + '!', {pitch:1.55, rate:.9});
      runStory();
    };
    c.appendChild(b);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
$('titlePal').innerHTML = ART[S.pal];
if(S.learned.length) $('resetBtn').style.display = 'block';

$('startBtn').onclick = async () => {
  // unlock audio inside the user gesture (iOS requirement)
  try{ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
  if(!voicesReady) loadVoices();
  Mic.init();   // fire inside the gesture so the prompt shows — but never wait for it
  buildAnimalGrid();
  goTo('sPick');
  speak('Who wants to come with you today?', {rate:.86});
};
$('resetBtn').onclick = () => {
  S.learned = []; save();
  $('resetBtn').style.display = 'none';
  alert('Cleared — Bobo has forgotten all the words.');
};
$('bookBtn').onclick = openBook;
$('againBtn').onclick = () => { buildStage(); goTo('sStory'); runStory(); };
$('homeBtn').onclick = () => {
  stopFlag = true;
  try{ speechSynthesis.cancel(); }catch(e){}
  $('titlePal').innerHTML = ART[S.pal];
  if(S.learned.length) $('resetBtn').style.display = 'block';
  goTo('sTitle');
};
$('skip').onclick = () => {
  try{ speechSynthesis.cancel(); }catch(e){}   // cuts the current line; story continues
};
$('micDot').onclick = () => {};

document.addEventListener('visibilitychange', () => {
  if(document.hidden){ try{ speechSynthesis.cancel(); }catch(e){} }
});
</script>
