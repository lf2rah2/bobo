<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story picker — four layouts</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Fredoka',ui-rounded,-apple-system,system-ui,sans-serif;
    background:#E9E2D4;color:#28353E;padding:20px 0 40px}
  .wrap{max-width:1500px;margin:0 auto;padding:0 16px}
  h1{font-size:24px;margin:0 0 4px;text-align:center}
  .lede{text-align:center;color:#7C8790;font-size:14.5px;margin:0 0 24px;line-height:1.5}
  .row{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .col{width:360px}
  .cap{text-align:center;margin:0 0 10px}
  .cap b{display:block;font-size:16px;font-weight:600}
  .cap span{display:block;font-size:12.5px;color:#7C8790;margin-top:2px;line-height:1.45;min-height:34px}
  .phone{width:360px;height:660px;background:#F3EEE4;border-radius:30px;overflow:hidden;
    box-shadow:0 10px 30px rgba(40,30,15,.22);position:relative}
  .hd{padding:20px 18px 12px;text-align:center}
  .hd h2{font-size:21px;font-weight:600;margin:0}
  .hd p{font-size:12.5px;color:#8B959C;margin:3px 0 0}
  .scroll{height:calc(100% - 78px);overflow:auto;padding:4px 16px 20px}
  img{display:block;width:100%;height:100%;object-fit:cover}

  /* ---------- A · book grid, two up ---------- */
  .gridA{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bookA{background:none;border:none;padding:0;font-family:inherit;text-align:left}
  .bookA .cover{position:relative;aspect-ratio:3/4;border-radius:5px 12px 12px 5px;overflow:hidden;
    box-shadow:0 5px 12px rgba(40,26,10,.26), inset 9px 0 12px -8px rgba(0,0,0,.5)}
  .bookA .cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:9px;
    background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.14) 70%,transparent);z-index:2}
  .bookA .badge{position:absolute;left:12px;bottom:8px;z-index:3;background:rgba(255,255,255,.94);
    border-radius:999px;font-size:10.5px;font-weight:600;padding:3px 8px;color:#3B4A55}
  .bookA b{display:block;font-size:14px;font-weight:600;margin-top:9px;line-height:1.25}
  .bookA span{display:block;font-size:11.5px;color:#8B959C;margin-top:1px}

  /* ---------- B · shelf ---------- */
  .shelf{margin-bottom:26px}
  .shelfRow{display:flex;gap:12px;align-items:flex-end;padding:0 4px 10px;
    border-bottom:9px solid #C8A87C;border-radius:0 0 4px 4px;
    box-shadow:0 8px 10px -8px rgba(0,0,0,.4)}
  .spine{flex:1;border-radius:4px 8px 8px 4px;overflow:hidden;position:relative;
    box-shadow:0 4px 9px rgba(40,26,10,.3)}
  .spine img{aspect-ratio:3/4}
  .spine.tall{margin-bottom:0}
  .spine.short{margin-bottom:0;transform:scale(.93);transform-origin:bottom}
  .shelfLab{display:flex;gap:12px;padding:8px 4px 0}
  .shelfLab div{flex:1;font-size:11px;font-weight:600;line-height:1.25;text-align:center}

  /* ---------- C · one big card, swipe ---------- */
  .deck{display:flex;gap:14px;overflow-x:auto;padding:6px 0 14px;scroll-snap-type:x mandatory}
  .cardC{flex:0 0 232px;scroll-snap-align:center;background:#fff;border-radius:18px;overflow:hidden;
    box-shadow:0 7px 18px rgba(40,26,10,.22)}
  .cardC .cover{aspect-ratio:3/4;position:relative}
  .cardC .meta{padding:11px 13px 14px}
  .cardC b{display:block;font-size:15px;font-weight:600;line-height:1.25}
  .cardC span{display:block;font-size:11.5px;color:#8B959C;margin-top:2px}
  .cardC .bar{height:5px;border-radius:3px;background:#E4DBC8;margin-top:9px;overflow:hidden}
  .cardC .bar i{display:block;height:100%;background:#E2694C}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#CBC2AF}
  .dots i.on{background:#E2694C;width:16px;border-radius:3px}

  /* ---------- D · tall poster list ---------- */
  .gridD{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .posterD{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;
    box-shadow:0 6px 15px rgba(40,26,10,.26)}
  .posterD .veil{position:absolute;inset:0;
    background:linear-gradient(transparent 38%,rgba(18,26,32,.86))}
  .posterD .txt{position:absolute;left:11px;right:11px;bottom:10px;color:#fff}
  .posterD b{display:block;font-size:14px;font-weight:600;line-height:1.2;
    text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .posterD span{display:block;font-size:10.5px;opacity:.85;margin-top:2px}
  .posterD .chip{position:absolute;right:9px;top:9px;background:rgba(255,255,255,.93);
    border-radius:999px;font-size:10px;font-weight:600;padding:3px 7px;color:#3B4A55}
</style></head><body>
<div class="wrap">
  <h1>Four ways to show the stories</h1>
  <p class="lede">Same six books, same covers. Pick the one that feels most like a bookshelf.</p>
  <div class="row" id="row"></div>
</div>

<script>
const BOOKS = [
  {t:'The Three Little Pigs',    s:'7 words · vector',        img:'art2/bg/garden.jpg',  pos:'center 42%', done:0, all:7},
  {t:'Itsy Bitsy Spider',        s:'9 words · claymation',    img:'art/bg/bg-rainbow.jpg',pos:'center top', done:3, all:9},
  {t:'The Gingerbread Man',      s:'a big chase · cartoon',   img:'art2/bg/meadow.jpg',  pos:'center 42%', done:8, all:8},
  {t:'Alice in Wonderland',      s:'a dream · moving film',   img:'art3/poster.jpg',     pos:'center 30%', done:2, all:8},
  {t:'The Ugly Duckling',        s:'four seasons · anime',    img:'art4/poster.jpg',     pos:'center 40%', done:0, all:8},
  {t:'Momotaro, the Peach Boy',  s:'a sea voyage · cartoon',  img:'art5/poster.jpg',     pos:'center 38%', done:0, all:8}
];
const cover = b => `<img src="${b.img}" alt="" style="object-position:${b.pos}">`;

const LAYOUTS = [
  {n:'A · Book grid', d:'Two per row, each with a spine and page-edge shading so it reads as a real book. Cover is 3:4 like a picture book.',
   html: `<div class="gridA">${BOOKS.map(b=>`
     <button class="bookA"><div class="cover">${cover(b)}<span class="badge">${b.done}/${b.all}</span></div>
     <b>${b.t}</b><span>${b.s}</span></button>`).join('')}</div>`},

  {n:'B · Bookshelf', d:'Books stood up on wooden shelves, three to a shelf. The most literal bookshelf, and the most playful.',
   html: [0,3].map(i=>`<div class="shelf"><div class="shelfRow">${BOOKS.slice(i,i+3).map((b,j)=>`
     <div class="spine ${j%2?'short':'tall'}">${cover(b)}</div>`).join('')}</div>
     <div class="shelfLab">${BOOKS.slice(i,i+3).map(b=>`<div>${b.t}</div>`).join('')}</div></div>`).join('')},

  {n:'C · Swipe deck', d:'One big card at a time, swiped sideways. Biggest cover art and a progress bar, but only one book visible.',
   html:`<div class="deck">${BOOKS.map(b=>`
     <div class="cardC"><div class="cover">${cover(b)}</div>
     <div class="meta"><b>${b.t}</b><span>${b.s}</span>
     <div class="bar"><i style="width:${Math.round(b.done/b.all*100)}%"></i></div></div></div>`).join('')}</div>
     <div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>`},

  {n:'D · Poster wall', d:'Tall movie-poster tiles with the title printed over the artwork. Most grown-up looking and shows the art biggest.',
   html:`<div class="gridD">${BOOKS.map(b=>`
     <div class="posterD">${cover(b)}<div class="veil"></div><span class="chip">${b.done}/${b.all}</span>
     <div class="txt"><b>${b.t}</b><span>${b.s}</span></div></div>`).join('')}</div>`}
];

document.getElementById('row').innerHTML = LAYOUTS.map(L=>`
  <div class="col">
    <div class="cap"><b>${L.n}</b><span>${L.d}</span></div>
    <div class="phone">
      <div class="hd"><h2>Which story shall we read?</h2><p>tap a book to begin</p></div>
      <div class="scroll">${L.html}</div>
    </div>
  </div>`).join('');
</script>
</body></html>
